# À chaque modification : tests automatiques complets, puis mise en ligne du site (GitHub Pages)
# qui sert l'application installable (Windows 11, iPhone, Android) et la page de téléchargement.
name: Tests et site

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Tests (leçons, sécurité, accessibilité, Chrome + Safari)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Navigateur de test
        run: |
          python -m pip install --quiet "playwright==1.49.1"
          python -m playwright install --with-deps chromium webkit
      - name: Tests (moteur de Chrome/Edge/Android et moteur de Safari/iPhone 13)
        env:
          BROWSERS: webkit,chromium
        run: python tests/test_app.py

  pages:
    name: Mise en ligne
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Voix natives enregistrées (cache)
        uses: actions/cache@v4
        with:
          path: web/audio
          key: voix-${{ hashFiles('tools/audio_texts.json') }}-${{ github.run_id }}
          restore-keys: voix-
      - name: Voix natives enregistrées (une voix neuronale par langue)
        shell: bash
        env:
          PYTHONUTF8: '1'
        run: |
          python -m pip install --quiet edge-tts
          python tools/make_audio.py
      - name: Préparer le site
        env:
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          cp -r web _site
          find _site -type f \( -name '*.html' -o -name '*.js' \) -exec sed -i "s#__REPO__#${REPO}#g; s#__BUILD__#${SHA:0:12}#g" {} +
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
